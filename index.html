<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tesoreria Campo Gedeoni</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f4e8c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tesoreria">
<style>
  :root { --bg:#f4f6f9; --card:#fff; --ink:#1d2733; --muted:#6b7785; --brand:#1f4e8c; --brand-d:#163a69; --line:#dde3ea; --ok:#1b7f4b; --bad:#b3261e; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--brand); color:#fff; padding:10px 12px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:5; }
  header h1 { font-size:1.05rem; margin:0; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header h1 small { display:block; font-size:.75rem; font-weight:400; opacity:.85; }
  #menuBtn { background:transparent; border:0; color:#fff; width:40px; height:40px; border-radius:8px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  #menuBtn:hover { background:rgba(255,255,255,.15); }
  #menuBtn span { display:block; width:22px; height:2px; background:#fff; border-radius:2px; box-shadow:0 -7px 0 #fff, 0 7px 0 #fff; }
  #demoBar { background:#fff3cd; color:#6b4e00; border-bottom:1px solid #ffe08a; padding:8px 16px; font-size:.85rem; text-align:center; }
  #shareBtn { background:transparent; border:0; color:#fff; width:40px; height:40px; border-radius:8px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  #shareBtn:hover { background:rgba(255,255,255,.15); }
  #shareBtn svg { width:24px; height:24px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .share-list { display:flex; flex-direction:column; gap:8px; margin:12px 0 4px; }
  .share-list a, .share-list button { display:flex; align-items:center; gap:12px; padding:12px 14px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); text-decoration:none; font:inherit; cursor:pointer; text-align:left; width:100%; }
  .share-list a:hover, .share-list button:hover { background:#eef3fa; }
  .share-list .ico { width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; flex:none; }
  .share-url { font-size:.8rem; word-break:break-all; background:#eef1f5; padding:8px 10px; border-radius:6px; }
  /* Menu a tendina laterale */
  #scrim { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:20; opacity:0; pointer-events:none; transition:opacity .2s; }
  nav { position:fixed; top:0; left:0; bottom:0; width:280px; max-width:85vw; background:var(--brand-d); color:#fff; z-index:21; display:flex; flex-direction:column; transform:translateX(-100%); transition:transform .25s ease; box-shadow:4px 0 16px rgba(0,0,0,.3); }
  body.menu-open nav { transform:none; }
  body.menu-open #scrim { opacity:1; pointer-events:auto; }
  nav .brand { display:flex; align-items:center; gap:12px; padding:18px 16px; background:var(--brand); }
  nav .brand b { display:block; font-size:1rem; } nav .brand span { font-size:.8rem; opacity:.85; }
  nav button { background:transparent; color:#fff; border:0; padding:14px 18px; text-align:left; cursor:pointer; font-size:1rem; display:flex; align-items:center; gap:14px; width:100%; }
  nav button svg { width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none; opacity:.9; }
  nav button.active { background:rgba(255,255,255,.18); font-weight:600; }
  nav button:hover { background:rgba(255,255,255,.12); }
  nav .spacer { flex:1; }
  nav .user { padding:12px 18px; font-size:.85rem; opacity:.85; border-top:1px solid rgba(255,255,255,.15); }
  nav #logout { border-top:1px solid rgba(255,255,255,.15); }
  main { max-width:960px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  h2 { margin:0 0 12px; font-size:1.2rem; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); font-size:.95rem; }
  th { color:var(--muted); font-weight:600; }
  td.num, th.num { text-align:right; font-variant-numeric: tabular-nums; }
  tfoot td { font-weight:600; border-top:1px solid var(--ink); border-bottom:0; }
  tfoot tr + tr td { border-top:1px solid var(--line); }
  tfoot tr.grand td { font-weight:700; border-top:2px solid var(--ink); }
  input, select, textarea { font:inherit; padding:8px; border:1px solid var(--line); border-radius:6px; width:100%; background:#fff; }
  input[readonly] { background:#eef1f5; color:var(--ink); }
  label { display:block; font-size:.85rem; color:var(--muted); margin-bottom:4px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; }
  button.primary { background:var(--brand); color:#fff; border:0; padding:10px 16px; border-radius:6px; cursor:pointer; font-size:1rem; }
  button.primary:hover { background:var(--brand-d); }
  button.link { background:none; border:0; color:var(--brand); cursor:pointer; padding:0; font:inherit; text-align:left; text-decoration:underline; }
  button.small { padding:4px 8px; border:1px solid var(--line); background:#fff; border-radius:5px; cursor:pointer; }
  button.danger { color:var(--bad); }
  .msg { margin-top:10px; font-size:.9rem; }
  .msg.err { color:var(--bad); } .msg.ok { color:var(--ok); }
  .big { font-size:1.6rem; font-weight:700; }
  .muted { color:var(--muted); font-size:.85rem; }
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; padding:16px; z-index:10; }
  .modal { background:#fff; border-radius:10px; padding:20px; max-width:480px; width:100%; max-height:90vh; overflow:auto; }
  .modal dl { display:grid; grid-template-columns:auto 1fr; gap:6px 14px; margin:12px 0; }
  .modal dt { color:var(--muted); } .modal dd { margin:0; }
  .modal.wide { max-width:560px; }
  .modal form table input { width:120px; }
  .modal .actions { display:flex; justify-content:flex-end; gap:8px; margin-top:12px; }
  tr.spese td { background:#fff7f6; }
  .bigbtn { display:block; width:100%; padding:16px; font-size:1.15rem; font-weight:600; margin-bottom:16px; border-radius:10px; box-shadow:0 3px 8px rgba(31,78,140,.3); }
  .dash { display:grid; grid-template-columns:minmax(200px,260px) 1fr; gap:20px; align-items:center; }
  @media (max-width:640px) { .dash { grid-template-columns:1fr; } .donut { max-width:260px; margin:0 auto; } }
  .donut { width:100%; height:auto; }
  .legend td { padding:5px 6px; font-size:.9rem; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:8px; vertical-align:middle; }
  .scroll { overflow-x:auto; }
  /* tabella compatta per il rendiconto (leggibile su telefono) */
  table.compact { table-layout:fixed; }
  table.compact th, table.compact td { font-size:.78rem; padding:6px 3px; line-height:1.2; }
  table.compact th { font-size:.68rem; text-transform:uppercase; letter-spacing:.02em; vertical-align:bottom; }
  table.compact td:first-child { font-size:.8rem; }
  table.compact tbody tr { cursor:pointer; }
  table.compact tbody tr:active, table.compact tbody tr:hover { background:#eef3fa; }
  table.compact td.num, table.compact th.num { white-space:nowrap; }
  table.compact tfoot td { font-size:.8rem; }
  table.compact tr.spese td { color:var(--bad); }
  table.compact .zero { color:#aab3bf; }
  @media (max-width:420px) { table.compact th, table.compact td { font-size:.72rem; padding:6px 2px; } table.compact td:first-child { font-size:.74rem; } }
  /* storico registrazioni: linea del tempo */
  h3.month { font-size:.8rem; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:18px 0 6px; }
  h3.month:first-of-type { margin-top:6px; }
  ol.timeline { list-style:none; margin:0; padding:0 0 0 18px; border-left:2px solid var(--line); }
  ol.timeline li { position:relative; margin:0 0 8px; }
  ol.timeline li::before { content:""; position:absolute; left:-24px; top:16px; width:10px; height:10px; border-radius:50%; background:var(--brand); border:2px solid #fff; box-shadow:0 0 0 1px var(--line); }
  ol.timeline li.cl::before { background:var(--bad); }
  button.tl { display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px 12px; cursor:pointer; font:inherit; color:var(--ink); }
  button.tl:hover, button.tl:active { background:#eef3fa; border-color:#b9c7da; }
  button.tl .day { flex:none; width:34px; height:34px; border-radius:8px; background:#e6ecf5; color:var(--brand); font-weight:700; display:flex; align-items:center; justify-content:center; font-size:.95rem; }
  li.cl button.tl .day { background:#fbe9e7; color:var(--bad); }
  button.tl .what { flex:1; min-width:0; display:flex; flex-direction:column; }
  button.tl .what b { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  button.tl .what small { color:var(--muted); font-size:.78rem; }
  button.tl .amt { font-weight:700; white-space:nowrap; font-variant-numeric:tabular-nums; }
  li.cl button.tl .amt { color:var(--bad); }
  .tl-total { display:flex; justify-content:space-between; border-top:2px solid var(--ink); margin-top:14px; padding-top:10px; font-size:1rem; }
  /* bilancio storico */
  button.fy { display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:12px; border:1px solid var(--line); border-radius:8px; margin-bottom:8px; background:#fff; font:inherit; color:var(--ink); cursor:pointer; }
  button.fy:hover { background:#eef3fa; }
  button.fy .yr { flex:none; width:62px; height:44px; border-radius:8px; background:#e6ecf5; color:var(--brand); font-weight:700; display:flex; align-items:center; justify-content:center; font-size:.9rem; }
  button.fy .what { flex:1; min-width:0; } button.fy .what b { display:block; font-weight:600; } button.fy .what small { color:var(--muted); font-size:.78rem; }
  button.fy .amt { font-weight:700; text-align:right; white-space:nowrap; } button.fy .amt small { display:block; font-weight:400; color:var(--muted); font-size:.72rem; }
  button.fy.cur { border-color:#b9c7da; background:#eef3fa; } button.fy.cur .yr { background:var(--brand); color:#fff; }
  .badge { display:inline-block; padding:1px 7px; border-radius:9px; font-size:.68rem; font-weight:700; background:#e6f4ec; color:var(--ok); vertical-align:middle; }
  .note { background:#eef3fa; border-left:4px solid var(--brand); padding:10px 12px; border-radius:6px; font-size:.88rem; margin:12px 0; }
  .note.warn { background:#fff3cd; border-color:#d9a420; color:#5b4400; }
  table.fy5 th, table.fy5 td, table.fy5 tfoot td { font-size:.72rem; padding:6px 2px; } table.fy5 td:first-child { font-size:.74rem; }
  table.fy5 tfoot td:first-child { font-size:.7rem; line-height:1.15; }
  @media (max-width:420px) { table.fy5 th, table.fy5 td, table.fy5 tfoot td { font-size:.64rem; padding:5px 1px; } table.fy5 td:first-child { font-size:.66rem; } table.fy5 tfoot td:first-child { font-size:.62rem; } }
  #login { max-width:360px; margin:12vh auto; }
  #updBar { position:fixed; left:12px; right:12px; bottom:12px; z-index:30; background:var(--ok); color:#fff; padding:12px 14px; border-radius:10px; display:flex; align-items:center; justify-content:space-between; gap:12px; box-shadow:0 4px 14px rgba(0,0,0,.25); font-size:.95rem; }
  #toast { position:fixed; left:50%; bottom:70px; transform:translateX(-50%) translateY(20px); background:#1d2733; color:#fff; padding:10px 16px; border-radius:8px; font-size:.9rem; opacity:0; pointer-events:none; transition:all .25s; z-index:40; max-width:90vw; text-align:center; box-shadow:0 4px 14px rgba(0,0,0,.25); }
  #toast.show { opacity:1; transform:translateX(-50%); }
  #toast.ok { background:var(--ok); } #toast.err { background:var(--bad); }
  #updBar button { background:#fff; color:var(--ok); border:0; border-radius:6px; padding:8px 14px; font-weight:700; cursor:pointer; font-size:.95rem; }
  .hidden { display:none !important; }
  @media print { header button, nav, .noprint { display:none !important; } }
</style>
</head>
<body>

<section id="login" class="card">
  <img src="icon.svg" alt="" width="88" height="88" style="display:block;margin:0 auto 12px">
  <h2>Tesoreria del Campo</h2>
  <p class="muted">Gedeoni Internazionali – accedi per continuare</p>
  <form id="loginForm">
    <label for="lu">Utente</label><input id="lu" autocomplete="username" required>
    <label for="lp" style="margin-top:10px">Password</label><input id="lp" type="password" autocomplete="current-password" required>
    <label style="display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--ink);font-size:.95rem;cursor:pointer"><input type="checkbox" id="lr" checked style="width:18px;height:18px;margin:0">Rimani connesso su questo dispositivo</label>
    <div id="loginMsg" class="msg err"></div>
    <button class="primary" style="margin-top:12px;width:100%">Entra</button>
  </form>
  <p class="muted version" style="text-align:center;margin:14px 0 0"></p>
</section>

<div id="app" class="hidden">
  <header>
    <button id="menuBtn" aria-label="Apri menu" aria-controls="nav" aria-expanded="false"><span></span></button>
    <h1 id="pageTitle">Tesoreria Campo Gedeoni</h1>
    <button id="shareBtn" aria-label="Condividi l'app" title="Condividi"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg></button>
  </header>
  <div id="demoBar" class="hidden">Dati di prova – account <b>test</b> (amministratore). I numeri sono inventati e vengono rigenerati a ogni accesso.</div>
  <div id="scrim"></div>
  <nav id="nav" aria-label="Menu principale">
    <div class="brand"><img src="icon.svg" alt="" width="44" height="44" style="border-radius:10px"><div><b>Tesoreria</b><span>Campo Gedeoni</span></div></div>
    <button data-v="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10M10 20v-6h4v6"/></svg>Riepilogo</button>
    <button data-v="rendiconto"><svg viewBox="0 0 24 24"><path d="M3 20h18M6 20v-8M11 20V6M16 20v-5M21 20V9"/></svg>Rendiconto del Campo</button>
    <button data-v="bilancio"><svg viewBox="0 0 24 24"><path d="M3 4h18v4H3zM5 8v12h14V8M10 12h4"/></svg>Bilancio Storico</button>
    <button data-v="nota"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Storico Registrazioni</button>
    <button data-v="chiusura"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M9 15l2 2 4-4"/></svg>Chiusura Cassa Annua</button>
    <button data-v="impost" class="hidden"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Impostazioni</button>
    <div class="spacer"></div>
    <div class="user" id="who"></div>
    <button id="logout"><svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3M13 4h6v16h-6"/></svg>Esci</button>
    <div class="version" style="padding:8px 18px 12px;font-size:.75rem;opacity:.6"></div>
  </nav>
  <main id="view"></main>
</div>

<div id="modalRoot"></div>
<div id="updBar" class="hidden"></div>
<div id="toast"></div>

<script>
// NOTA: app interamente lato browser; i dati sono salvati in localStorage di questo dispositivo.
const VERSION = '4.1'; // aggiornare a ogni modifica (vedi VERSIONI.md)
document.querySelectorAll('.version').forEach(el => el.textContent = 'Versione ' + VERSION);

/* Controllo aggiornamenti: rilegge index.html dal server (aggiornando la copia in cache)
   e, se la versione pubblicata è diversa da questa, propone di ricaricare. */
async function checkUpdate() {
  if (location.protocol === 'file:') return;
  try {
    const html = await (await fetch('index.html', { cache: 'reload' })).text();
    const m = html.match(/const VERSION = '([^']+)'/);
    if (m && m[1] !== VERSION) {
      $('#updBar').innerHTML = `Nuova versione ${esc(m[1])} disponibile <button id="updBtn">Aggiorna</button>`;
      $('#updBar').classList.remove('hidden');
      $('#updBtn').onclick = () => location.reload();
    }
  } catch(e) {}
}
// Utenti: quelli predefiniti, sostituiti da quelli salvati dall'amministratore in Impostazioni (su questo dispositivo)
/* ---------- server condiviso (API su Vercel + MongoDB Atlas) ----------
   Gli account veri e i dati del Campo stanno sul server: tutti i dispositivi vedono le stesse cose.
   L'account di prova "test" resta locale, con dati inventati. */
const VERCEL_URL = 'https://gtesoreria.vercel.app'; // indirizzo dell'API quando l'app è aperta da GitHub Pages
const API_BASE = (location.protocol === 'file:' || location.hostname.endsWith('github.io')) ? VERCEL_URL : '';
let token = null;      // token di accesso ricevuto dal server
let dbVersion = 0;     // versione dei dati sul server (per accorgersi di modifiche da altri dispositivi)
async function api(path, method = 'GET', body) {
  let r;
  try {
    r = await fetch(API_BASE + '/api/' + path, { method, headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) }, body: body ? JSON.stringify(body) : undefined });
  } catch (e) { const err = new Error('server non raggiungibile (controlla la connessione)'); err.status = 0; throw err; }
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (!r.ok) { const err = new Error(j.error || ('errore ' + r.status)); err.status = r.status; err.data = j; throw err; }
  return j;
}
const DEMO_USER = { name: 'test', pw: 'test' };
// il nome utente non distingue maiuscole/minuscole (la tastiera del telefono mette la prima lettera maiuscola)
const sameName = (a, b) => a.trim().toLowerCase() === b.trim().toLowerCase();
const isDemoName = name => sameName(name, DEMO_USER.name);
const SPESE = 'Spese del Campo';
const PRO = 'Pro Campo';
const ACCOUNTS = ['Pro Campo','Offerte Gedeoni','Offerte Ausiliarie','PWT Gedeoni','PWT Ausiliarie',
  'Fondo Barnaba Gedeoni','Fondo Barnaba Ausiliarie','Offerte delle Chiese','Offerte Amico dei Gedeoni',
  'Gideons Card','Offerte per la Convention','Offerte nuovi Gedeoni','Offerte nuovi Ausiliarie','Quota annua Gedeoni','Quota annua Ausiliarie', SPESE];
const FUNDS = ACCOUNTS.filter(a => a !== SPESE); // conti che detengono denaro
const COLORS = ['#1f4e8c','#1b7f4b','#d9a420','#a8323c','#2c8c9e','#6a4c93','#e07a1f','#4a5a6e','#8fb339','#c2185b','#00796b','#5d4037','#7986cb','#00897b','#f06292'];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = n => new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(n);
const n2 = n => new Intl.NumberFormat('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n); // senza simbolo €
const fdate = d => d ? d.split('-').reverse().join('/') : '';
const today = () => new Date().toISOString().slice(0,10);
const round = n => Math.round(n*100)/100;
const sum = arr => round(arr.reduce((s,n) => s + (n||0), 0));

const DB_KEY = 'gedeoni_tesoreria', DEMO_KEY = 'gedeoni_tesoreria_demo';
let db = load();
let session = null;
let view = 'home';
const storageKey = () => session && session.demo ? DEMO_KEY : DB_KEY;

/* Dati:
   regs:     [{id, date, place, items:{conto: importo}, by}]      registrazioni (una per riunione/luogo)
   closings: [{id, date, by, bank, items:{conto: importo}, total}] chiusure cassa annue */
function load(key = DB_KEY) {
  try {
    const d = JSON.parse(localStorage.getItem(key));
    if (d && d.regs) return d;
    if (d && d.entries) return migrate(d);
  } catch(e){}
  return { regs: [], closings: [], seq: 1 };
}
// Converte il vecchio formato (una riga per conto) nel nuovo (registrazione con più conti)
function migrate(old) {
  const db2 = { regs: [], closings: old.closings.map(c => ({ ...c, items: {} })), seq: old.seq || 1 };
  for (const e of old.entries) {
    if (e.closingId) { const c = db2.closings.find(x => x.id === e.closingId); if (c) c.items[e.account] = round((c.items[e.account]||0) - e.amount); }
    else db2.regs.push({ id: e.id, date: e.date, place: e.note || '', items: { [e.account]: e.amount }, by: e.by });
  }
  return db2;
}
function save() {
  try { localStorage.setItem(storageKey(), JSON.stringify(db)); } catch(e){}
  if (session && !session.demo) pushRemote();
}
/* Invio al server, una richiesta alla volta. Se nel frattempo un altro dispositivo ha salvato (409),
   si prendono i dati del server e si avvisa di ripetere l'ultima operazione. */
let pushChain = Promise.resolve();
function pushRemote() {
  pushChain = pushChain.then(async () => {
    toast('Salvataggio…');
    try {
      const r = await api('data', 'PUT', { regs: db.regs, closings: db.closings, seq: db.seq, version: dbVersion });
      dbVersion = r.version; toast('Salvato', 'ok');
    } catch (e) {
      if (e.status === 409) { applyRemote(e.data); toast('Nel frattempo un altro dispositivo ha salvato: dati aggiornati. La tua ultima operazione non è stata registrata, ripetila.', 'err', 9000); closeModal(); go(view); }
      else if (e.status === 401) { toast('Accesso scaduto: entra di nuovo.', 'err'); doLogout(); }
      else { toast('Non salvato: ' + e.message, 'err', 9000); await refreshRemote(true); }
    }
  });
  return pushChain;
}
function applyRemote(r) { db = { regs: r.regs || [], closings: r.closings || [], seq: r.seq || 1 }; dbVersion = r.version || 0; try { localStorage.setItem(DB_KEY, JSON.stringify(db)); } catch(e){} }
const MIGRATED_KEY = 'gedeoni_trasferiti';
// Carica i dati dal server; la prima volta propone di trasferire quelli rimasti su questo dispositivo
async function loadRemote() {
  const r = await api('data');
  const local = load();
  const hasLocal = local.regs.length || local.closings.length;
  if (hasLocal && !r.regs.length && !r.closings.length && !localStorage.getItem(MIGRATED_KEY)) {
    if (confirm(`Su questo dispositivo ci sono ${local.regs.length} registrazioni e ${local.closings.length} chiusure di cassa non ancora nel database condiviso. Caricarle adesso?`)) {
      db = local; dbVersion = r.version || 0;
      await api('data', 'PUT', { regs: db.regs, closings: db.closings, seq: db.seq, version: dbVersion }).then(x => { dbVersion = x.version; });
      try { localStorage.setItem(MIGRATED_KEY, '1'); } catch(e){}
      toast('Dati trasferiti nel database condiviso', 'ok'); return;
    }
    try { localStorage.setItem(MIGRATED_KEY, 'no'); } catch(e){}
  }
  if (hasLocal && JSON.stringify({ regs: local.regs, closings: local.closings }) !== JSON.stringify({ regs: r.regs, closings: r.closings })) {
    try { localStorage.setItem('gedeoni_tesoreria_backup_locale', JSON.stringify(local)); } catch(e){} // copia di sicurezza dei vecchi dati locali
  }
  applyRemote(r);
}
// Rilegge dal server (ogni minuto e quando si torna sull'app); se c'è una versione nuova, aggiorna la pagina
async function refreshRemote(force) {
  if (!session || session.demo) return;
  try {
    const r = await api('data');
    if (force || r.version !== dbVersion) { applyRemote(r); if (!$('#modalRoot').children.length) go(view); }
  } catch (e) { if (e.status === 401) doLogout(); }
}
setInterval(() => { if (!document.hidden) refreshRemote(); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshRemote(); });
let toastTimer = null;
function toast(text, kind = '', ms = 2500) {
  const t = $('#toast'); t.textContent = text; t.className = 'show ' + kind;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = '', ms);
}

/* ---------- dati di prova per l'account test ---------- */
function demoData() {
  let seed = 20261021; // generatore pseudo-casuale con seme fisso: stessi dati a ogni accesso
  const rnd = () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };
  const pick = arr => arr[Math.floor(rnd() * arr.length)];
  const amt = (min, max) => Math.round((min + rnd() * (max - min)) * 2) / 2; // multipli di 0,50
  const PLACES = ['Chiesa Evangelica di Vittoria', 'Chiesa di Comiso', 'Chiesa di Ragusa', 'Chiesa di Modica', 'Chiesa di Scicli',
    'Chiesa di Gela', 'Chiesa di Niscemi', 'Chiesa di Acate', 'Riunione mensile del Campo', 'Cena di preghiera', 'Colazione di preghiera',
    'Convention regionale', 'Chiesa di Santa Croce Camerina', 'Chiesa di Ispica', 'Chiesa di Pozzallo'];
  const NAMES = ['Giuseppe Russo', 'Salvatore Vitale', 'Antonio Greco', 'Francesco Puglisi'];
  const BANKS = ['Banca Agricola Popolare di Ragusa', 'Intesa Sanpaolo', 'UniCredit', 'Poste Italiane'];
  const d = { regs: [], closings: [], seq: 1 };
  // 100 registrazioni distribuite su 24 mesi (ottobre 2024 → settembre 2026)
  const start = new Date(2024, 9, 1);
  for (let i = 0; i < 100; i++) {
    const day = new Date(start); day.setDate(day.getDate() + Math.floor(i * 7.3 + rnd() * 5));
    const date = day.toISOString().slice(0, 10);
    const items = { [PRO]: amt(3, 20) };
    if (rnd() < .8) items['Offerte Gedeoni'] = amt(12, 58);
    if (rnd() < .6) items['Offerte Ausiliarie'] = amt(7, 24);
    if (rnd() < .5) items['PWT Gedeoni'] = amt(7, 24);
    if (rnd() < .35) items['PWT Ausiliarie'] = amt(3, 15);
    if (rnd() < .25) items['Fondo Barnaba Gedeoni'] = amt(2, 12);
    if (rnd() < .15) items['Fondo Barnaba Ausiliarie'] = amt(2, 10);
    if (rnd() < .4) items['Offerte delle Chiese'] = amt(3, 17);
    if (rnd() < .2) items['Offerte Amico dei Gedeoni'] = amt(3, 31);
    if (rnd() < .3) items['Gideons Card'] = amt(2, 12);
    if (rnd() < .12) items['Offerte per la Convention'] = amt(5, 24);
    if (rnd() < .1) items['Offerte nuovi Gedeoni'] = amt(10, 20);
    if (rnd() < .08) items['Offerte nuovi Ausiliarie'] = amt(7, 12);
    if (rnd() < .27) items['Quota annua Gedeoni'] = 38 * (rnd() < .75 ? 1 : 2); // 38 € a Gedeone
    if (rnd() < .25) items['Quota annua Ausiliarie'] = 9 * (1 + Math.floor(rnd() * 3)); // 9 € ad Ausiliaria
    if (rnd() < .3) items[SPESE] = amt(2, Math.min(24, items[PRO]));
    d.regs.push({ id: d.seq++, date, place: pick(PLACES), items, by: 'test' });
  }
  // bonifici di chiusura dell'anno fiscale: il primo in ritardo (8 giugno 2025), il secondo in tempo (28 maggio 2026); tolgono circa il 62% di ogni conto
  for (const [date, idx] of [['2025-06-08', 0], ['2026-05-28', 1]]) {
    const { b } = balances(d.regs.filter(r => r.date <= date), d.closings.filter(c => c.date <= date));
    const items = {};
    for (const a of FUNDS) { const v = Math.floor(b[a] * 0.62); if (v > 0) items[a] = v; }
    d.closings.push({ id: d.seq++, date, by: NAMES[idx], bank: BANKS[idx], items, total: sum(Object.values(items)), closesYear: true });
  }
  return d;
}

function balances(regs = db.regs, closings = db.closings) {
  const b = Object.fromEntries(FUNDS.map(a => [a, 0]));
  let spese = 0;
  for (const r of regs) for (const [a, v] of Object.entries(r.items)) {
    if (a === SPESE) { b[PRO] -= v; spese += v; } else b[a] += v;
  }
  for (const c of closings) for (const [a, v] of Object.entries(c.items)) b[a] -= v;
  for (const a of FUNDS) b[a] = round(b[a]);
  return { b, spese: round(spese) };
}
const total = b => sum(FUNDS.map(a => b[a]));
const regTotal = r => sum(FUNDS.map(a => r.items[a]));       // entrate della registrazione
const regNet = r => round(regTotal(r) - (r.items[SPESE]||0)); // al netto delle spese
const others = b => round(total(b) - b[PRO]);                   // tutti i conti tranne Pro Campo
// nessun conto può andare sotto zero con questi dati
const valid = (regs = db.regs, closings = db.closings) => { const { b } = balances(regs, closings); return FUNDS.every(a => b[a] > -0.005); };

/* ---------- anno fiscale (1 giugno – 31 maggio) ---------- */
const fyLabel = y => `${y}/${String(y + 1).slice(2)}`;
const nominalFY = d => { const [y, m] = d.split('-').map(Number); return m >= 6 ? y : y - 1; }; // anno nominale (inizio) di una data
const nextDay = d => { const t = new Date(d + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + 1); return t.toISOString().slice(0, 10); };
const dShort = d => fdate(d).slice(0, 5); // gg/mm
/* Anni fiscali con i confini reali. L'anno nominale va dal 1° giugno al 31 maggio, ma si chiude davvero con il
   bonifico di chiusura (Chiusura Cassa con "chiude l'anno fiscale"): se il bonifico è registrato entro il 31 maggio
   l'anno si chiude il 31 maggio; se arriva dopo, l'anno resta aperto e si chiude il giorno del bonifico; il nuovo
   anno parte dal giorno successivo. Senza bonifico l'anno resta aperto (anche oltre il 31 maggio). */
function fyList(regsAll = db.regs, clsAll = db.closings) {
  const dates = [...regsAll, ...clsAll].map(x => x.date).sort();
  let y = Math.min(nominalFY(dates[0] || today()), nominalFY(today()));
  let from = `${y}-06-01`;
  const closers = clsAll.filter(c => c.closesYear !== false).sort((a, b) => a.date.localeCompare(b.date));
  const list = [];
  for (let n = 0; n < 200; n++) {
    const nominalEnd = `${y + 1}-05-31`;
    const onTime = closers.find(c => c.date >= from && c.date <= nominalEnd);
    const late = onTime ? null : closers.find(c => c.date >= from && c.date > nominalEnd);
    const closer = onTime || late || null;
    const to = onTime ? nominalEnd : late ? late.date : null;
    const closed = !!to && to < today();
    list.push({ y, label: fyLabel(y), from, to, nominalEnd, closer, closed, late: !!late, overdue: !closed && today() > nominalEnd });
    if (!closed) break;
    from = nextDay(to); y++;
  }
  return list;
}
const currentFY = () => fyList().at(-1).y;
const fyOfDate = d => { const l = fyList(); return l.find(f => d >= f.from && (!f.to || d <= f.to)) || (d < l[0].from ? l[0] : l.at(-1)); };
function fyYears() { return fyList().map(f => f.y).reverse(); }
// Rendiconto di un anno fiscale: riporto all'apertura, entrate, spese e bonifici, saldo alla chiusura (o a oggi)
function fyReport(y, regsAll = db.regs, clsAll = db.closings) {
  const info = fyList(regsAll, clsAll).find(f => f.y === y);
  if (!info) return null;
  const from = info.from, to = info.to || '9999-12-31';
  const open = balances(regsAll.filter(r => r.date < from), clsAll.filter(c => c.date < from)).b;
  const regs = regsAll.filter(r => r.date >= from && r.date <= to), cls = clsAll.filter(c => c.date >= from && c.date <= to);
  const close = balances(regsAll.filter(r => r.date <= to), clsAll.filter(c => c.date <= to)).b;
  const spese = sum(regs.map(r => r.items[SPESE]));
  const rows = FUNDS.map(a => ({ a, open: open[a], in: sum(regs.map(r => r.items[a])),
    out: round((a === PRO ? spese : 0) + sum(cls.map(c => c.items[a]))), close: close[a] }));
  const t = k => sum(rows.map(r => r[k]));
  return { ...info, regs, cls, spese, rows, open, tot: { open: t('open'), in: t('in'), out: t('out'), close: t('close') } };
}
function fyTable(rep, current) {

  const cell = v => `<td class="num${v ? '' : ' zero'}">${n2(v)}</td>`;

    <thead><tr><th>Conto</th><th class="num">Riporto<br>${dShort(rep.from)}</th><th class="num">Entrate</th><th class="num">Spese e<br>bonifici</th><th class="num">${current ? 'Saldo<br>oggi' : `Saldo<br>${dShort(rep.to)}`}</th></tr></thead><tbody>
    ${rep.rows.map(r => `<tr data-d="${esc(r.a)}"><td>${esc(r.a)}</td>${cell(r.open)}${cell(r.in)}${cell(r.out)}<td class="num"><b>${n2(r.close)}</b></td></tr>`).join('')}
    <tr class="spese" data-d="${SPESE}"><td>${SPESE}<br><span class="muted" style="font-size:.65rem">a carico di ${PRO}</span></td><td class="num zero">—</td><td class="num zero">—</td><td class="num">${n2(rep.spese)}</td><td class="num zero">—</td></tr>

    <tr><td>Totale altri conti</td>${['open', 'in', 'out'].map(k => cell(sum(alt.map(r => r[k])))).join('')}<td class="num">${n2(sum(alt.map(r => r.close)))}</td></tr>

    </tfoot></table>`;
}
// data in un anno fiscale già chiuso: solo l'amministratore, con conferma (il bilancio archiviato viene ricalcolato)
function closedYearOk(date, msgEl) {
  const f = fyOfDate(date);
  if (!f.closed) return true;
  if (session.role !== 'admin') { msgEl.textContent = `L’anno fiscale ${f.label} è chiuso (${fdate(f.to)}): solo l’amministratore può registrare con questa data.`; return false; }

}

const SESSION_KEY = 'gedeoni_sessione';
// fresh: true rigenera i dati di prova (nuovo accesso con l'account test)
async function enter(s, fresh) {
  session = s;
  if (s.demo) { const d = load(DEMO_KEY); db = fresh || !d.regs.length ? demoData() : d; save(); }
  else {
    token = s.token;
    try { await loadRemote(); }
    catch (e) { session = null; token = null; $('#loginMsg').textContent = e.status === 401 ? 'Accesso scaduto: entra di nuovo.' : 'Impossibile caricare i dati: ' + e.message; if (e.status === 401) try { localStorage.removeItem(SESSION_KEY); } catch(x){}; return; }
  }
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#who').textContent = session.name + (session.demo ? ' (amministratore di prova)' : session.role === 'admin' ? ' (amministratore)' : '');
  $('#nav [data-v=impost]').classList.toggle('hidden', session.role !== 'admin' || session.demo);
  $('#demoBar').classList.toggle('hidden', !session.demo);

$('#loginForm').addEventListener('submit', async ev => {
  ev.preventDefault();
  const name = $('#lu').value.trim(), pw = $('#lp').value, btn = $('#loginForm button.primary');
  const remember = s => { try { if ($('#lr').checked) localStorage.setItem(SESSION_KEY, JSON.stringify(s)); else localStorage.removeItem(SESSION_KEY); } catch(e){} };
  if (isDemoName(name)) {
    if (pw !== DEMO_USER.pw) return $('#loginMsg').textContent = 'Utente o password non corretti.';
    const s = { name: DEMO_USER.name, role: 'admin', demo: true }; remember(s); return enter(s, true);
  }
  btn.disabled = true; $('#loginMsg').textContent = 'Collegamento al server…';
  try {
    const r = await api('login', 'POST', { user: name, password: pw });
    const s = { name: r.name, role: r.role, demo: false, token: r.token }; remember(s);
    await enter(s);
  } catch (e) { $('#loginMsg').textContent = e.status === 401 ? e.message : 'Impossibile collegarsi: ' + e.message; }
  btn.disabled = false;
});

/* ---------- grafico a ciambella (SVG) ---------- */
function donut(b) {
  const tot = total(b), R = 80, r = 52, C = 2 * Math.PI * ((R + r) / 2), w = R - r;
  let off = 0, segs = '';
  FUNDS.forEach((a, i) => {
    const v = Math.max(b[a], 0); if (!v || tot <= 0) return;
    const len = C * v / tot;
    segs += `<circle r="${(R + r) / 2}" cx="100" cy="100" fill="none" stroke="${COLORS[i]}" stroke-width="${w}" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"><title>${esc(a)}: ${eur(v)}</title></circle>`;
    off += len;
  });
  if (!segs) segs = `<circle r="${(R + r) / 2}" cx="100" cy="100" fill="none" stroke="#dde3ea" stroke-width="${w}"/>`;
  return `<svg viewBox="0 0 200 200" class="donut" role="img" aria-label="Ripartizione della cassa">${segs}
    <text x="100" y="94" text-anchor="middle" font-size="11" fill="#6b7785">TOTALE CASSA</text>
    <text x="100" y="116" text-anchor="middle" font-size="${tot >= 100000 ? 16 : 20}" font-weight="700" fill="#1d2733">${eur(tot)}</text></svg>`;
}

/* ---------- popup Nuova Registrazione ---------- */
// existing: registrazione da modificare (solo amministratore); senza, ne crea una nuova
function formRegistrazione(existing) {
  const otherRegs = existing ? db.regs.filter(r => r.id !== existing.id) : db.regs;
  const { b } = balances(otherRegs);
  const it = existing ? existing.items : {};
  modal(`<h2>${existing ? 'Modifica registrazione' : 'Nuova Registrazione'}</h2>
    <form id="rf">
      <div class="grid">
        <div><label>Data di registrazione</label><input type="date" id="rd" value="${existing ? existing.date : today()}" required></div>
        <div><label>Luogo</label><input id="rl" value="${esc(existing ? existing.place : '')}" placeholder="es. Chiesa di Vittoria" maxlength="80" required></div>
      </div>
      <table style="margin-top:14px"><thead><tr><th>Conto</th><th class="num">Importo (€)</th></tr></thead><tbody>
      ${ACCOUNTS.map((a, i) => `<tr${a === SPESE ? ' class="spese"' : ''}><td>${esc(a)}${a === SPESE ? `<br><span class="muted">tolte da ${PRO}</span>` : ''}</td>
        <td><input type="number" class="ri" data-i="${i}" min="0" step="0.01" value="${it[a] ?? ''}" placeholder="0,00" inputmode="decimal" style="text-align:right;width:120px"></td></tr>`).join('')}
      </tbody><tfoot>
        <tr><td>Totale entrate</td><td class="num" id="rt">${eur(0)}</td></tr>
        <tr id="rnRow" class="hidden"><td>Totale al netto delle spese</td><td class="num" id="rn">${eur(0)}</td></tr>
      </tfoot></table>
      <div id="rmsg" class="msg err"></div>
      <div class="actions">${existing ? '<button type="button" class="small danger" id="rDelete" style="margin-right:auto">Elimina</button>' : ''}<button type="button" class="small" id="rCancel">Annulla</button><button class="primary">Salva</button></div>
    </form>`, { close: false });
  if (existing) $('#rDelete').onclick = () => {
    if (!confirm(`Eliminare definitivamente la registrazione del ${fdate(existing.date)}?`)) return;
    if (!valid(otherRegs)) return $('#rmsg').textContent = 'Non si può eliminare: un conto andrebbe sotto zero (controlla le chiusure di cassa successive).';
    db.regs = otherRegs; save(); closeModal(); go(view);
  };
  const inputs = [...document.querySelectorAll('.ri')];
  const read = () => { const items = {}; inputs.forEach(i => { const v = round(parseFloat(i.value)); if (v > 0) items[ACCOUNTS[+i.dataset.i]] = v; }); return items; };
  const refresh = () => {
    const it = read(), r = { items: it };
    $('#rt').textContent = eur(regTotal(r));
    $('#rnRow').classList.toggle('hidden', !it[SPESE]);
    $('#rn').textContent = eur(regNet(r));
  };
  inputs.forEach(i => i.oninput = refresh); refresh();
  $('#rCancel').onclick = closeModal;
  $('#rf').onsubmit = ev => {
    ev.preventDefault();
    const items = read(), msg = $('#rmsg');
    if (inputs.some(i => i.value && !(parseFloat(i.value) >= 0))) return msg.textContent = 'Controlla gli importi inseriti.';
    if (!Object.keys(items).length) return msg.textContent = 'Inserisci almeno un importo.';
    if (items[SPESE] && items[SPESE] > b[PRO] + (items[PRO] || 0) + 1e-9) return msg.textContent = `Le spese superano il disponibile di ${PRO} (${eur(b[PRO] + (items[PRO] || 0))}).`;
    if (!closedYearOk($('#rd').value, msg)) return;
    const reg = { id: existing ? existing.id : db.seq++, date: $('#rd').value, place: $('#rl').value.trim(), items, by: existing ? existing.by : session.name };
    if (existing) reg.editedBy = session.name;
    const next = [...otherRegs, reg];
    if (!valid(next)) return msg.textContent = 'Con questi importi un conto andrebbe sotto zero (controlla le chiusure di cassa successive).';
    db.regs = next; save(); closeModal(); go(view);
  };
}

// modifica di una chiusura di cassa (solo amministratore)
function formChiusura(existing) {
  const otherCl = db.closings.filter(c => c.id !== existing.id);
  const { b } = balances(db.regs, otherCl); // cassa senza questa chiusura
  modal(`<h2>Modifica chiusura cassa</h2>
    <form id="cef">
      <div class="grid">
        <div><label>Data del bonifico</label><input type="date" id="ced" value="${existing.date}" required></div>
        <div><label>Nome di chi ha fatto il bonifico</label><input id="cen" value="${esc(existing.by)}" required></div>
        <div><label>Istituto di credito</label><input id="ceb" value="${esc(existing.bank)}" required></div>
        <div style="grid-column:1/-1"><label style="display:flex;gap:8px;align-items:center;color:var(--ink);font-size:.95rem;cursor:pointer"><input type="checkbox" id="cey"${existing.closesYear !== false ? ' checked' : ''} style="width:18px;height:18px;margin:0">Questo bonifico chiude l’anno fiscale (chiusura annua)</label></div>
      </div>
      <table style="margin-top:14px"><thead><tr><th>Conto</th><th class="num">Tolto (€)</th><th class="num">Disponibile</th></tr></thead><tbody>
      ${FUNDS.map((a, i) => `<tr><td>${esc(a)}</td><td><input type="number" class="ce" data-i="${i}" min="0" step="0.01" value="${existing.items[a] ?? ''}" placeholder="0,00" inputmode="decimal" style="text-align:right;width:110px"></td><td class="num muted">${n2(b[a])}</td></tr>`).join('')}
      </tbody><tfoot><tr><td>Totale</td><td class="num" id="cet"></td><td></td></tr></tfoot></table>
      <div id="cemsg" class="msg err"></div>
      <div class="actions"><button type="button" class="small danger" id="ceDelete" style="margin-right:auto">Elimina</button><button type="button" class="small" id="ceCancel">Annulla</button><button class="primary">Salva</button></div>
    </form>`, { close: false });
  const inputs = [...document.querySelectorAll('.ce')];
  const read = () => { const items = {}; inputs.forEach(i => { const v = round(parseFloat(i.value)); if (v > 0) items[FUNDS[+i.dataset.i]] = v; }); return items; };
  const refresh = () => $('#cet').textContent = eur(sum(Object.values(read())));
  inputs.forEach(i => i.oninput = refresh); refresh();
  $('#ceCancel').onclick = closeModal;
  $('#ceDelete').onclick = () => {
    if (!confirm(`Eliminare la chiusura cassa del ${fdate(existing.date)}? Gli importi torneranno in cassa.`)) return;
    db.closings = otherCl; save(); closeModal(); go(view);
  };
  $('#cef').onsubmit = ev => {
    ev.preventDefault();
    const items = read(), msg = $('#cemsg');
    if (!Object.keys(items).length) return msg.textContent = 'Inserisci almeno una somma.';
    const bad = Object.entries(items).find(([a, v]) => v > b[a] + 1e-9);
    if (bad) return msg.textContent = `Importo superiore al disponibile per “${bad[0]}”.`;
    if (!closedYearOk($('#ced').value, msg)) return;
    const cl = { ...existing, date: $('#ced').value, by: $('#cen').value.trim(), bank: $('#ceb').value.trim(), items, total: sum(Object.values(items)), closesYear: $('#cey').checked, editedBy: session.name };
    db.closings = [...otherCl, cl].sort((x, y) => x.date.localeCompare(y.date) || x.id - y.id);
    save(); closeModal(); go(view);
  };
}

// dettaglio di un conto nell'anno fiscale y (riporto + movimenti dell'anno)
function dettaglio(account, y = currentFY()) {
  const admin = session.role === 'admin';
  const rep = fyReport(y), from = rep.from;
  const regs = rep.regs.filter(r => r.items[account] != null).sort((x, z) => x.date.localeCompare(z.date) || x.id - z.id);
  const cls = rep.cls.filter(c => c.items[account]).sort((x, z) => x.date.localeCompare(z.date));
  const riporto = account !== SPESE ? `<tr><td>${fdate(from)}</td><td class="muted">Riporto anno ${fyLabel(y - 1)}</td><td class="num">${eur(rep.open[account])}</td>${admin ? '<td></td>' : ''}</tr>` : '';
  modal(`<h2>${esc(account)}</h2><p class="muted" style="margin-top:-6px">Anno fiscale ${fyLabel(y)}</p>
    <table><thead><tr><th>Data</th><th>Luogo</th><th class="num">Importo</th>${admin ? '<th></th>' : ''}</tr></thead><tbody>
    ${riporto}
    ${regs.map(r => `<tr><td>${fdate(r.date)}</td><td>${esc(r.place)}</td>
      <td class="num">${admin ? `<input type="number" step="0.01" min="0.01" value="${r.items[account]}" data-edit="${r.id}" style="width:110px;text-align:right">` : eur(r.items[account])}</td>
      ${admin ? `<td><button class="small danger" data-del="${r.id}">Elimina</button></td>` : ''}</tr>`).join('')}
    ${cls.map(c => `<tr><td>${fdate(c.date)}</td><td class="muted">Chiusura cassa</td><td class="num">−${eur(c.items[account])}</td>${admin ? '<td></td>' : ''}</tr>`).join('')}
    ${!regs.length && !cls.length ? `<tr><td colspan="4" class="muted">Nessun movimento in quest’anno.</td></tr>` : ''}
    </tbody></table>
    ${admin && regs.length ? '<p class="msg err" id="dmsg"></p><p class="muted">Modifica un importo e premi Invio per salvare.</p>' : ''}`);
  const msg = t => { const m = $('#dmsg'); if (m) m.textContent = t; };
  const valid = list => { const { b } = balances(list); return FUNDS.every(a => b[a] > -0.005); };
  document.querySelectorAll('[data-edit]').forEach(inp => inp.onchange = () => {
    const v = round(parseFloat(inp.value)), id = +inp.dataset.edit;
    if (!(v > 0)) return msg('Importo non valido.');
    const next = db.regs.map(r => r.id === id ? { ...r, items: { ...r.items, [account]: v } } : r);
    if (!valid(next)) return msg('La modifica renderebbe negativo il saldo di un conto.');
    db.regs = next; save(); closeModal(); dettaglio(account, y); go(view);
  });
  document.querySelectorAll('[data-del]').forEach(btn => btn.onclick = () => {
    if (!confirm(`Eliminare l’importo di “${account}” da questa registrazione?`)) return;
    const id = +btn.dataset.del;
    const next = db.regs.map(r => { if (r.id !== id) return r; const items = { ...r.items }; delete items[account]; return { ...r, items }; })
      .filter(r => Object.keys(r.items).length);
    if (!valid(next)) return msg('L’eliminazione renderebbe negativo il saldo di un conto.');
    db.regs = next; save(); closeModal(); dettaglio(account, y); go(view);
  });
}

/* ---------- 3. Prima Nota ---------- */
function vNota() {
  const list = [...db.regs.map(r => ({ t: 'reg', d: r.date, id: r.id, o: r })), ...db.closings.map(c => ({ t: 'cl', d: c.date, id: c.id, o: c }))]
    .sort((x, y) => y.d.localeCompare(x.d) || y.id - x.id);
  const MESI = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
  const mese = d => { const [y, m] = d.split('-'); return MESI[+m - 1] + ' ' + y; };
  const giorno = d => d.split('-')[2];
  // raggruppa per mese (la lista è già in ordine dal più recente)
  const groups = [];
  for (const x of list) { const k = x.d.slice(0, 7); if (!groups.length || groups[groups.length - 1].k !== k) groups.push({ k, label: mese(x.d), items: [] }); groups[groups.length - 1].items.push(x); }
  const first = list.length ? list[list.length - 1].d : null;
  $('#view').innerHTML = `<div class="card">
    <h2>Storico Registrazioni</h2>
    <p class="muted">${list.length ? `${db.regs.length} registrazion${db.regs.length === 1 ? 'e' : 'i'}${db.closings.length ? ` e ${db.closings.length} chiusur${db.closings.length === 1 ? 'a' : 'e'} di cassa` : ''} dal ${fdate(first)}. Tocca una voce per vedere il dettaglio.` : 'Qui compariranno, nel tempo, tutte le registrazioni fatte.'}</p>
    ${groups.map(g => `<h3 class="month">${esc(g.label)}</h3><ol class="timeline">
      ${g.items.map(x => x.t === 'reg'
        ? `<li><button class="tl" data-reg="${x.id}"><span class="day">${giorno(x.d)}</span><span class="what"><b>${esc(x.o.place) || 'Registrazione'}</b><small>${Object.keys(x.o.items).length} cont${Object.keys(x.o.items).length === 1 ? 'o' : 'i'}${x.o.items[SPESE] ? ' · con spese' : ''}</small></span><span class="amt">${eur(regNet(x.o))}</span></button></li>`
        : `<li class="cl"><button class="tl" data-cl="${x.id}"><span class="day">${giorno(x.d)}</span><span class="what"><b>Chiusura cassa</b><small>bonifico ${esc(x.o.bank)}</small></span><span class="amt">−${eur(x.o.total)}</span></button></li>`).join('')}
    </ol>`).join('')}
    ${list.length ? `<div class="tl-total"><span>Totale cassa del campo</span><b>${eur(total(balances().b))}</b></div>` : ''}
  </div>`;
  const admin = session.role === 'admin';
  const editBtn = (attr, id) => admin ? `<button class="small" ${attr}="${id}" style="float:left">✎ Modifica</button>` : '';
  $('#view').querySelectorAll('[data-reg]').forEach(b => b.onclick = () => {
    const r = db.regs.find(x => x.id === +b.dataset.reg);
    modal(`<h2>Registrazione del ${fdate(r.date)}</h2>
      <dl><dt>Luogo</dt><dd>${esc(r.place) || '—'}</dd><dt>Inserita da</dt><dd>${esc(r.by || '')}${r.editedBy ? ` <span class="muted">(modificata da ${esc(r.editedBy)})</span>` : ''}</dd></dl>
      <table><tbody>${ACCOUNTS.filter(a => r.items[a]).map(a => `<tr><td>${esc(a)}</td><td class="num">${a === SPESE ? '−' : ''}${eur(r.items[a])}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td>Totale entrate</td><td class="num">${eur(regTotal(r))}</td></tr>${r.items[SPESE] ? `<tr><td>Al netto delle spese</td><td class="num">${eur(regNet(r))}</td></tr>` : ''}</tfoot></table>
      ${editBtn('data-edit-reg', r.id)}`);
    if (admin) $('[data-edit-reg]').onclick = () => { closeModal(); formRegistrazione(r); };
  });
  $('#view').querySelectorAll('[data-cl]').forEach(b => b.onclick = () => {
    const c = db.closings.find(x => x.id === +b.dataset.cl);
    modal(`<h2>Chiusura cassa del ${fdate(c.date)}</h2>
      <dl><dt>Bonifico fatto da</dt><dd>${esc(c.by)}</dd><dt>Istituto di credito</dt><dd>${esc(c.bank)}</dd>${c.closesYear !== false ? '<dt>Tipo</dt><dd>Bonifico di chiusura dell’anno fiscale</dd>' : ''}${c.editedBy ? `<dt>Modificata da</dt><dd>${esc(c.editedBy)}</dd>` : ''}</dl>
      <table><tbody>${FUNDS.filter(a => c.items[a]).map(a => `<tr><td>${esc(a)}</td><td class="num">−${eur(c.items[a])}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td>Totale tolto dalla cassa</td><td class="num">−${eur(c.total)}</td></tr></tfoot></table>
      ${editBtn('data-edit-cl', c.id)}`);
    if (admin) $('[data-edit-cl]').onclick = () => { closeModal(); formChiusura(c); };
  });
}

      <h3 style="font-size:1rem;margin:20px 0 8px">Conferma</h3>
      <div class="grid"><div><label>Password attuale dell'amministratore</label><input id="cp" type="password" autocomplete="current-password" required></div></div>
      <div id="umsg" class="msg err"></div>
      <div class="actions" style="justify-content:flex-start"><button class="primary">Salva</button><button type="button" class="small" id="uReset">Ripristina quelli iniziali</button></div>
    </form>
  </div>`;
  const msg = (t, ok) => { const m = $('#umsg'); m.className = 'msg ' + (ok ? 'ok' : 'err'); m.textContent = t; };
  const send = async body => {
    try {
      const r = await api('users', 'PUT', body);
      token = r.token; session.name = r.admin; $('#who').textContent = r.admin + ' (amministratore)';
      try { if (localStorage.getItem(SESSION_KEY)) localStorage.setItem(SESSION_KEY, JSON.stringify({ ...session, token })); } catch(e){}
      renderImpostazioni({ user: r.user, admin: r.admin }); $('#umsg').className = 'msg ok'; $('#umsg').textContent = 'Salvato. Dalla prossima volta usa i nuovi dati per entrare.';
    } catch (e) { msg(e.message); }
  };
  $('#uf').onsubmit = ev => {
    ev.preventDefault();
    const un = $('#un').value.trim(), up = $('#up').value, up2 = $('#up2').value;
    const an = $('#an').value.trim(), ap = $('#ap').value, ap2 = $('#ap2').value;
    if (!un || !an) return msg('I nomi utente non possono essere vuoti.');
    if (sameName(un, an)) return msg('I due nomi utente devono essere diversi.');
    if (isDemoName(un) || isDemoName(an)) return msg(`“${DEMO_USER.name}” è riservato all’account di prova.`);
    if ((up && up.length < 4) || (ap && ap.length < 4)) return msg('Le password devono avere almeno 4 caratteri.');
    if (up !== up2) return msg('Le due password nuove dell’utente generico non coincidono.');
    if (ap !== ap2) return msg('Le due password nuove dell’amministratore non coincidono.');
    send({ currentPassword: $('#cp').value, user: { name: un, password: up || undefined }, admin: { name: an, password: ap || undefined } });
  };
  $('#uReset').onclick = () => {
    if (!$('#cp').value) return msg('Inserisci la password attuale dell’amministratore per confermare.');
    if (!confirm('Ripristinare gli utenti e le password iniziali?')) return;
    send({ currentPassword: $('#cp').value, reset: true });
  };
}

/* ---------- 4. Chiusura cassa annua ---------- */
function vChiusura() {
  const { b } = balances();
  $('#view').innerHTML = `<div class="card"><h2>Chiusura Cassa Annua</h2>
    <form id="cf">
      <div class="grid">
        <div><label>Data del bonifico</label><input type="date" id="cd" value="${today()}" required></div>
        <div><label>Nome di chi ha fatto il bonifico</label><input id="cn" required></div>
        <div><label>Istituto di credito</label><input id="cb" required></div>
        <div style="grid-column:1/-1"><label style="display:flex;gap:8px;align-items:center;color:var(--ink);font-size:.95rem;cursor:pointer"><input type="checkbox" id="cy" checked style="width:18px;height:18px;margin:0">Questo bonifico chiude l’anno fiscale (chiusura annua)</label></div>
      </div>
      <table style="margin-top:16px"><thead><tr><th>Conto</th><th class="num">Somma da togliere (€)</th><th class="num">In cassa</th></tr></thead><tbody>
      ${FUNDS.map((a, i) => `<tr><td>${esc(a)}</td>
        <td><input type="number" class="w" data-i="${i}" min="0" step="0.01" max="${b[a]}" placeholder="0,00" inputmode="decimal" style="text-align:right"></td>
        <td><input readonly value="${eur(b[a])}" style="text-align:right" tabindex="-1"></td></tr>`).join('')}
      </tbody><tfoot>
        <tr><td>${PRO}</td><td class="num" id="ctp">${eur(0)}</td><td class="num">${eur(b[PRO])}</td></tr>
        <tr><td>Altri conti</td><td class="num" id="cta">${eur(0)}</td><td class="num">${eur(others(b))}</td></tr>
        <tr class="grand"><td>Totale che si sta togliendo</td><td class="num" id="ct">${eur(0)}</td><td class="num">${eur(total(b))}</td></tr>
      </tfoot></table>
      <div id="cmsg" class="msg err"></div>
      <button class="primary" style="margin-top:12px">Registra chiusura</button>
    </form>
    ${db.closings.length ? `<h2 style="margin-top:24px">Chiusure precedenti</h2><table><thead><tr><th>Data bonifico</th><th>Eseguito da</th><th>Istituto</th><th class="num">Totale</th></tr></thead><tbody>
    ${[...db.closings].reverse().map(c => `<tr><td>${fdate(c.date)}</td><td>${esc(c.by)}</td><td>${esc(c.bank)}</td><td class="num">${eur(c.total)}</td></tr>`).join('')}</tbody></table>` : ''}
  </div>`;
  const inputs = [...document.querySelectorAll('.w')];
  const tot = () => sum(inputs.map(i => parseFloat(i.value)));
  inputs.forEach(i => i.oninput = () => {
    const pro = round(parseFloat(inputs[0].value) || 0), t = tot();
    $('#ctp').textContent = eur(pro); $('#cta').textContent = eur(round(t - pro)); $('#ct').textContent = eur(t);
  });
  $('#cf').onsubmit = ev => {
    ev.preventDefault();
    const msg = $('#cmsg'); msg.className = 'msg err';
    const items = {};
    for (const i of inputs) { const v = round(parseFloat(i.value) || 0); if (v) items[FUNDS[+i.dataset.i]] = v; }
    if (Object.values(items).some(v => v < 0)) return msg.textContent = 'Gli importi non possono essere negativi.';
    const bad = Object.entries(items).find(([a, v]) => v > b[a] + 1e-9);
    if (bad) return msg.textContent = `Importo superiore alla cassa per “${bad[0]}”.`;
    if (!Object.keys(items).length) return msg.textContent = 'Inserisci almeno una somma da togliere.';
    const t = sum(Object.values(items));
    if (!closedYearOk($('#cd').value, msg)) return;
    if (!confirm(`Registrare la chiusura per un totale di ${eur(t)}? I saldi verranno ridotti.`)) return;
    db.closings.push({ id: db.seq++, date: $('#cd').value, by: $('#cn').value.trim(), bank: $('#cb').value.trim(), items, total: t, closesYear: $('#cy').checked });
    save(); vChiusura();
    $('#cmsg').className = 'msg ok'; $('#cmsg').textContent = `Chiusura registrata: ${eur(t)}.`;
  };
}

// riapre la sessione salvata con "Rimani connesso" (in fondo: tutte le funzioni e costanti sono già definite)
let saved = null;
try { saved = JSON.parse(localStorage.getItem(SESSION_KEY)); } catch(e){}
if (saved && saved.demo) enter({ name: DEMO_USER.name, role: 'admin', demo: true });
else if (saved && saved.token) enter(saved);

checkUpdate();
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });
</script>
